services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-context-planner
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - "${TERRAIN_CONTOUR_HOST_PATH}:/app/data/contours:ro"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
